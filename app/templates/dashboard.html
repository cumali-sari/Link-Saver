<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Url</th>
                    <th>Tags</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody>
                {% for resource in resources %}
                <tr>
                    <td>{{ resource.title }}</td>
                    <td>{{ resource.url }}</td>
                    <td>{{ resource.tags }}</td>
                    <td>{{ resource.description }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </body>
</html>
